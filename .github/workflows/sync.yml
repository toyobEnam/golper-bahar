name: Sync Comments and Story Stats

on:
  schedule:
    # বাংলাদেশ সময় সকাল ৮টা, দুপুর ২টা ও রাত ৯টায় স্বয়ংক্রিয়ভাবে চলবে (UTC 02:00, 08:00, 15:00)
    - cron: '0 2,8,15 * * *'
  workflow_dispatch: # রিপোজিটরি থেকে ম্যানুয়ালি রান করার বাটন

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sync Script
        run: node sync-comments.js

      - name: Commit and Push Changes
        id: push_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "push_success=false" >> "$GITHUB_OUTPUT"

          if git diff-index --quiet HEAD; then
            echo "কোনো নতুন ফাইল পরিবর্তনের প্রয়োজন হয়নি।"
            echo "GitHub-এ কোনো push করা হয়নি।"
          else
            git commit -m "Auto-sync approved comments and story stats [skip ci]"
            git push origin main

            echo "GitHub push সফল হয়েছে।"
            echo "push_success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove Successfully Synced Comments from Google Sheet
        if: ${{ steps.push_changes.outputs.push_success == 'true' && hashFiles('.sync-comment-ids.json') != '' }}
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwU75Chu74PABjZ_GYXT4fGD6XTAU1KXA5sS7WnP7tdeOcxsPAMtyAjKiaPlCKzutDW/exec"
        run: |
          echo "Google Sheet cleanup শুরু হচ্ছে..."

          COMMENT_IDS=$(cat .sync-comment-ids.json)

          RESPONSE=$(curl -L -s -X POST "$APPS_SCRIPT_URL" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"cleanupSyncedComments\",\"secret\":\"$SYNC_SECRET\",\"commentIds\":$COMMENT_IDS}")

          echo "Apps Script response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"success":true' || {
            echo "Google Sheet cleanup ব্যর্থ হয়েছে!"
            exit 1
          }

          echo "Google Sheet থেকে synced comments সফলভাবে মুছে ফেলা হয়েছে।"